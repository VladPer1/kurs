openapi: "3.0.3"
info:
  title: "Course & Training Management System API (ИПР №1)"
  version: "1.0.0"
  description: "Безопасный REST API для системы управления курсами, личным кабинетом студента, кабинетом преподавателя и динамическим RBAC (Role-Based Access Control). Спецификация сгенерирована из декларативных аннотаций Swaggo (// Method Godoc, @Summary, @Description, @Tags, @Param, @Success, @Failure, @Router) в контроллерах."
servers:
  - url: "/api/v1"
    description: "API v1 Base Endpoint"
tags:
  - name: "auth"
    description: "Регистрация, вход, refresh токенов и аудит безопасности (OWASP A07)"
  - name: "users"
    description: "Управление пользователями и связанными курсами (Только Администратор)"
  - name: "roles"
    description: "Управление ролями и динамическими атомарными правами (Dynamic RBAC)"
  - name: "courses"
    description: "Каталог, создание и управление курсами (право courses:create)"
  - name: "instructors"
    description: "Профили преподавателей и просмотр записанных студентов"
  - name: "enrollments"
    description: "Запись на курсы и управление заявками"
  - name: "cards"
    description: "Привязка и безопасное хранение карт (AES-256-GCM, OWASP A02)"
  - name: "payments"
    description: "Оплата курсов и реестр финансовых транзакций"
  - name: "system"
    description: "Health check и метрики производительности"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Введите JWT Access токен (Bearer <token>)"
paths:
  /auth/register:
    post:
      tags:
        - "auth"
      summary: "Регистрация нового студента"
      description: "Регистрирует нового пользователя с базовой ролью student и хеширует пароль bcrypt"
      parameters: []
      responses:
        201:
          description: "models.AuthResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        409:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Данные регистрации"
        content:
          application/json:
            schema:
              type: "object"
  /auth/login:
    post:
      tags:
        - "auth"
      summary: "Вход в систему"
      description: "Аутентификация с защитой от брутфорса (блокировка на 15 мин после 5 попыток)"
      parameters: []
      responses:
        200:
          description: "models.AuthResponse"
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        423:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Учетные данные"
        content:
          application/json:
            schema:
              type: "object"
  /auth/refresh:
    post:
      tags:
        - "auth"
      summary: "Обновить Access Token"
      description: "Выпуск нового токена по Refresh Token из HttpOnly cookie"
      parameters: []
      responses:
        200:
          description: "models.TokenResponse"
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
  /auth/logout:
    post:
      tags:
        - "auth"
      summary: "Выход из системы"
      description: "Очистка сессионных cookie"
      parameters: []
      responses:
        200:
          description: "models.SuccessResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /auth/me:
    get:
      tags:
        - "auth"
      summary: "Текущий аутентифицированный пользователь"
      description: "Возвращает профиль текущего пользователя и его актуальные права (RBAC)"
      parameters: []
      responses:
        200:
          description: "models.CurrentUserResponse"
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /cards:
    get:
      tags:
        - "cards"
      summary: "Сохраненные банковские карты"
      description: "Безопасный просмотр масок карт без раскрытия шифротекста (OWASP A02, разрешение cards:manage)"
      parameters: []
      responses:
        200:
          description: "models.CardListResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
    post:
      tags:
        - "cards"
      summary: "Привязать банковскую карту"
      description: "Шифрование данных карты по алгоритму AES-256-GCM с контролем целостности (разрешение cards:manage)"
      parameters: []
      responses:
        201:
          description: "models.CardResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Реквизиты карты"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /cards/{id}:
    delete:
      tags:
        - "cards"
      summary: "Удалить карту"
      description: "Удаление привязанной карты (разрешение cards:manage)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Card ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.SuccessResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /courses:
    get:
      tags:
        - "courses"
      summary: "Каталог курсов"
      description: "Каталог опубликованных курсов с фильтрацией, пагинацией и поиском"
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "Номер страницы"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "Количество на страницу"
          schema:
            type: "integer"
        - name: "search"
          in: "query"
          required: false
          description: "Поиск по названию или описанию"
          schema:
            type: "string"
        - name: "min_price"
          in: "query"
          required: false
          description: "Минимальная цена"
          schema:
            type: "number"
        - name: "max_price"
          in: "query"
          required: false
          description: "Максимальная цена"
          schema:
            type: "number"
        - name: "instructor_id"
          in: "query"
          required: false
          description: "ID преподавателя"
          schema:
            type: "string"
      responses:
        200:
          description: "models.CourseListResponse"
          content:
            application/json:
              schema:
                type: "object"
    post:
      tags:
        - "courses"
      summary: "Создать курс"
      description: "Создание нового курса (требуется особое разрешение courses:create)"
      parameters: []
      responses:
        201:
          description: "models.CourseResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Данные курса"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /courses/{id}:
    get:
      tags:
        - "courses"
      summary: "Детали курса по ID"
      description: "Возвращает полную информацию о курсе"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Course ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.CourseResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
    put:
      tags:
        - "courses"
      summary: "Редактировать курс"
      description: "Редактирование курса (разрешение courses:edit, только автор или админ)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Course ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.CourseResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Обновляемые поля"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
    delete:
      tags:
        - "courses"
      summary: "Удалить курс"
      description: "Удаление курса (разрешение courses:delete, запрещено при наличии активных записей)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Course ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.SuccessResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /courses/{id}/students:
    get:
      tags:
        - "courses"
      summary: "Список студентов курса"
      description: "Возвращает список студентов конкретного курса (разрешение courses:view_students)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Course ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.CourseStudentsResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /enrollments:
    post:
      tags:
        - "enrollments"
      summary: "Записаться на курс"
      description: "Бронирование места на курсе (разрешение enrollments:create)"
      parameters: []
      responses:
        201:
          description: "models.EnrollmentResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "ID курса"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /enrollments/my:
    get:
      tags:
        - "enrollments"
      summary: "Мои записи на курсы"
      description: "Список курсов текущего студента (разрешение enrollments:view_my)"
      parameters: []
      responses:
        200:
          description: "models.EnrollmentListResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /enrollments/instructor:
    get:
      tags:
        - "enrollments"
      summary: "Записи студентов на курсы преподавателя"
      description: "Просмотр записей студентов для преподавателя (разрешение enrollments:view_instructor)"
      parameters: []
      responses:
        200:
          description: "models.EnrollmentListResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /enrollments/{id}:
    delete:
      tags:
        - "enrollments"
      summary: "Отменить запись на курс"
      description: "Отмена записи с возвратом места в квоту (разрешение enrollments:cancel)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Enrollment ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.SuccessResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /instructors:
    get:
      tags:
        - "instructors"
      summary: "Список преподавателей"
      description: "Публичный список преподавателей с рейтингом и курсами"
      parameters: []
      responses:
        200:
          description: "models.InstructorListResponse"
          content:
            application/json:
              schema:
                type: "object"
    post:
      tags:
        - "instructors"
      summary: "Создать профиль преподавателя"
      description: "Создает профиль преподавателя (разрешение instructors:manage)"
      parameters: []
      responses:
        201:
          description: "models.InstructorResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        409:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Данные профиля"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /instructors/{id}:
    get:
      tags:
        - "instructors"
      summary: "Профиль преподавателя по ID"
      description: "Возвращает информацию о преподавателе"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Instructor ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.InstructorResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
    put:
      tags:
        - "instructors"
      summary: "Обновить профиль преподавателя"
      description: "Обновление био, специализации и рейтинга (разрешение instructors:manage)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Instructor ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.InstructorResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Данные профиля"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /instructors/my/students:
    get:
      tags:
        - "instructors"
      summary: "Список студентов преподавателя"
      description: "Просмотр всех студентов, обучающихся на курсах преподавателя (разрешение instructors:view_students)"
      parameters: []
      responses:
        200:
          description: "models.InstructorStudentsResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /payments/checkout:
    post:
      tags:
        - "payments"
      summary: "Оплата курса"
      description: "Проведение оплаты за выбранный курс в ACID-транзакции (разрешение payments:create)"
      parameters: []
      responses:
        200:
          description: "models.PaymentSuccessResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "ID записи и карты"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /payments/my:
    get:
      tags:
        - "payments"
      summary: "История платежей пользователя"
      description: "История оплат текущего пользователя (разрешение payments:view_my)"
      parameters: []
      responses:
        200:
          description: "models.MyPaymentsResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /payments:
    get:
      tags:
        - "payments"
      summary: "Реестр всех платежей платформы"
      description: "Полный журнал оплат курсов (Только Администратор, разрешение payments:view_all)"
      parameters: []
      responses:
        200:
          description: "models.PaymentListResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /roles:
    get:
      tags:
        - "roles"
      summary: "Получить список всех ролей"
      description: "Возвращает роли с привязанными правами (пермишн roles:manage)"
      parameters: []
      responses:
        200:
          description: "models.RoleListResponse"
          content:
            application/json:
              schema:
                type: "object"
        403:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
    post:
      tags:
        - "roles"
      summary: "Создать новую роль"
      description: "Создает новую системную или пользовательскую роль (пермишн roles:manage)"
      parameters: []
      responses:
        201:
          description: "models.RoleResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        409:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Данные роли"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /roles/{id}:
    put:
      tags:
        - "roles"
      summary: "Обновить роль"
      description: "Обновляет название или описание роли (запрещено переименовывать базовые роли)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Role ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.RoleResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Новые данные роли"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
    delete:
      tags:
        - "roles"
      summary: "Удалить роль"
      description: "Удаляет кастомную роль (запрещено удалять системные роли и роли, назначенные пользователям)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Role ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.SuccessResponse"
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: "models.ErrorResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /permissions:
    get:
      tags:
        - "roles"
      summary: "Получить список всех прав"
      description: "Возвращает справочник всех атомарных прав системы (пермишн permissions:view)"
      parameters: []
      responses:
        200:
          description: "models.PermissionsListResponse"
          content:
            application/json:
              schema:
                type: "object"
      security:
        - bearerAuth: []
  /roles/{id}/permissions:
    post:
      tags:
        - "roles"
      summary: "Назначить права роли"
      description: "Динамическое назначение атомарных прав роли (пермишн roles:manage)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          description: "Role ID"
          schema:
            type: "string"
      responses:
        200:
          description: "models.RoleResponse"
          content:
            application/json:
              schema:
                type: "object"
      requestBody:
        required: true
        description: "Список прав"
        content:
          application/json:
            schema:
              type: "object"
      security:
        - bearerAuth: []
  /users/{id}/role:
    patch:
      tags:
        - "roles"
      summary: "Назначить роль пользователю"
